<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">📝 Test<span>Platform</span></a>
  </div>

  <div class="container narrow">
    <div class="card">
      <h1>Student login</h1>
      <p class="muted">Log in with the email your teacher used to invite you.</p>
      <div id="msg" class="msg hidden"></div>
      <form id="login-form">
        <label>Email</label>
        <input type="email" id="email" required>
        <label>Password</label>
        <input type="password" id="password" required>
        <div style="margin-top:18px"><button class="btn" type="submit">Log in</button></div>
      </form>
    </div>
    <p class="center muted">
      <a href="/forgot-password.html">Forgot password?</a><br>
      Don't have an account yet? Ask your teacher for a signup link.<br>
      Are you a teacher? <a href="/teacher-login.html">Teacher login</a>
    </p>
  </div>

  <script src="/js/app.js"></script>
  <script>
    (async () => {
      const u = await currentUser();
      if (u) location.href = u.role === 'teacher' ? '/teacher.html' : '/student.html';
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/api/login', 'POST', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        location.href = '/student.html';
      } catch (err) { showMsg('msg', err.message); }
    });
  </script>
</body>
</html>
