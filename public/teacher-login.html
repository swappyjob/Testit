<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">📝 Test<span>Platform</span></a>
  </div>

  <div class="container narrow">
    <div class="card">
      <div class="tabs">
        <button class="tab active" id="tab-login" onclick="switchTab('login')">Log in</button>
        <button class="tab" id="tab-register" onclick="switchTab('register')">Create account</button>
      </div>

      <div id="msg" class="msg hidden"></div>

      <!-- LOGIN -->
      <form id="login-form">
        <label>Email</label>
        <input type="email" id="l-email" required>
        <label>Password</label>
        <input type="password" id="l-password" required>
        <div style="margin-top:18px"><button class="btn" type="submit">Log in</button></div>
      </form>

      <!-- REGISTER -->
      <form id="register-form" class="hidden">
        <label>Your name</label>
        <input type="text" id="r-name" required>
        <label>Email</label>
        <input type="email" id="r-email" required>
        <label>Password (min 6 characters)</label>
        <input type="password" id="r-password" required>
        <div style="margin-top:18px"><button class="btn" type="submit">Create teacher account</button></div>
      </form>
    </div>
    <p class="center muted">
      <a href="/forgot-password.html">Forgot password?</a><br>
      Are you a student? <a href="/student-login.html">Student login</a>
    </p>
  </div>

  <script src="/js/app.js"></script>
  <script>
    requireRoleRedirect();
    async function requireRoleRedirect() {
      const u = await currentUser();
      if (u) location.href = u.role === 'teacher' ? '/teacher.html' : '/student.html';
    }

    function switchTab(which) {
      document.getElementById('tab-login').classList.toggle('active', which === 'login');
      document.getElementById('tab-register').classList.toggle('active', which === 'register');
      document.getElementById('login-form').classList.toggle('hidden', which !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', which !== 'register');
      document.getElementById('msg').classList.add('hidden');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/api/login', 'POST', {
          email: document.getElementById('l-email').value,
          password: document.getElementById('l-password').value,
        });
        location.href = '/teacher.html';
      } catch (err) { showMsg('msg', err.message); }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/api/register-teacher', 'POST', {
          name: document.getElementById('r-name').value,
          email: document.getElementById('r-email').value,
          password: document.getElementById('r-password').value,
        });
        location.href = '/teacher.html';
      } catch (err) { showMsg('msg', err.message); }
    });
  </script>
</body>
</html>
