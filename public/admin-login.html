<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">📝 Test<span>Platform</span></a>
  </div>

  <div class="container narrow">
    <div class="card">
      <h1>Admin login</h1>
      <p class="muted">Platform administrator sign-in.</p>
      <div id="msg" class="msg hidden"></div>
      <form id="login-form">
        <label>Email</label>
        <input type="email" id="email" required>
        <label>Password</label>
        <input type="password" id="password" required>
        <div style="margin-top:18px"><button class="btn" type="submit">Log in</button></div>
      </form>
    </div>
    <p class="center muted"><a href="/forgot-password.html">Forgot password?</a></p>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const dash = (role) => role === 'admin' ? '/admin.html' : (role === 'teacher' ? '/teacher.html' : '/student.html');
    (async () => {
      const u = await currentUser();
      if (u) location.href = dash(u.role);
    })();
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const { user } = await api('/api/login', 'POST', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        location.href = dash(user.role);
      } catch (err) { showMsg('msg', err.message); }
    });
  </script>
</body>
</html>
