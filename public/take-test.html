<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take Test</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/student.html">📝 Test<span>Platform</span></a>
    <div class="row">
      <span class="user" id="who"></span>
      <a class="btn ghost small" href="/student.html">Exit</a>
    </div>
  </div>

  <div class="container">
    <div id="msg" class="msg hidden"></div>

    <div id="test-view" class="hidden">
      <div class="card">
        <h1 id="test-title"></h1>
        <p class="muted" id="test-desc"></p>
        <div id="negmark-warn" class="msg hidden" style="background:#fef3c7;color:#92400e"></div>
        <div id="timer" class="hidden" style="font-weight:700; font-size:20px; margin-top:8px"></div>
      </div>
      <form id="test-form">
        <div id="questions"></div>
        <div class="card">
          <div class="row" style="justify-content:space-between; align-items:center">
            <button class="btn ghost" type="button" id="prev-btn">← Previous</button>
            <span class="muted" id="progress"></span>
            <button class="btn" type="button" id="next-btn">Next →</button>
            <button class="btn hidden" type="submit" id="submit-btn">Submit test</button>
          </div>
          <p class="muted" style="margin:10px 0 0; font-size:13px">
            Use Previous / Next to move between questions. Your answers are kept as you navigate. You can only submit once.
          </p>
        </div>
      </form>
    </div>

    <!-- Result shown after submission -->
    <div id="result-view" class="hidden">
      <div class="card center">
        <h1>✅ Test submitted!</h1>
        <p id="result-score" style="font-size:22px"></p>
        <p class="muted" id="result-note"></p>
        <a class="btn" href="/student.html">Back to my tests</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const assignmentId = new URLSearchParams(location.search).get('a');
    let QUESTIONS = [];

    (async () => {
      const me = await requireRole('student', '/student-login.html');
      if (!me) return;
      document.getElementById('who').textContent = me.name + ' · Student';
      try {
        const { test, questions, durationMinutes, remainingSeconds } = await api('/api/take/' + assignmentId);
        QUESTIONS = questions;
        document.getElementById('test-title').textContent = test.title;
        const desc = document.getElementById('test-desc');
        desc.textContent = test.description || '';
        if (test.due_date) {
          const d = new Date(test.due_date);
          const when = isNaN(d) ? test.due_date : d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
          desc.textContent += (test.description ? '  ·  ' : '') + '⏰ Due: ' + when;
        }
        if (test.negative_marking) {
          const w = document.getElementById('negmark-warn');
          w.textContent = `⚠️ Negative marking is ON: ${test.penalty} mark(s) will be deducted for each wrong multiple-choice / true-false answer. Leaving a question blank costs nothing.`;
          w.classList.remove('hidden');
        }
        renderQuestions(questions);
        document.getElementById('test-view').classList.remove('hidden');
        startTimer(durationMinutes, remainingSeconds);
      } catch (err) {
        showMsg('msg', err.message);
      }
    })();

    // ---- Countdown timer (server-anchored) with auto-submit ----
    let timerInterval = null;
    function startTimer(durationMinutes, remainingSeconds) {
      if (!durationMinutes || remainingSeconds == null) return; // untimed test
      const el = document.getElementById('timer');
      el.classList.remove('hidden');
      let remaining = remainingSeconds;
      const render = () => {
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        el.textContent = `⏱ Time left: ${m}:${String(s).padStart(2, '0')}`;
        el.style.color = remaining <= 30 ? 'var(--red)' : 'var(--brand)';
      };
      if (remaining <= 0) { render(); submitTest(true); return; }
      render();
      timerInterval = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          remaining = 0;
          render();
          clearInterval(timerInterval);
          submitTest(true);
        } else {
          render();
        }
      }, 1000);
    }

    function renderQuestions(questions) {
      const box = document.getElementById('questions');
      questions.forEach((q, i) => {
        const card = el(`<div class="q-card q-page">
          <h3>Q${i + 1}. ${escapeHtml(q.prompt)} <span class="muted">(${q.points} pt)</span></h3>
        </div>`);
        if (q.image) card.append(el(`<img src="${q.image}" style="max-width:100%;max-height:260px;border:1px solid var(--line);border-radius:8px;display:block;margin-bottom:10px">`));
        if (q.type === 'mcq') {
          q.options.forEach((opt, idx) => {
            card.append(el(`<label class="choice">
              <input type="radio" name="q${q.id}" value="${idx}"> ${escapeHtml(opt)}
            </label>`));
          });
        } else if (q.type === 'truefalse') {
          ['true', 'false'].forEach((v) => {
            card.append(el(`<label class="choice">
              <input type="radio" name="q${q.id}" value="${v}"> ${v === 'true' ? 'True' : 'False'}
            </label>`));
          });
        } else {
          card.append(el(`<textarea name="q${q.id}" placeholder="Type your answer..."></textarea>`));
        }
        box.append(card);
      });
      initNav();
    }

    // ---- One-question-per-page navigation (no page refresh) ----
    let current = 0;
    function initNav() {
      document.getElementById('prev-btn').onclick = () => showQuestion(current - 1);
      document.getElementById('next-btn').onclick = () => showQuestion(current + 1);
      showQuestion(0);
    }
    function showQuestion(i) {
      const pages = [...document.querySelectorAll('#questions .q-page')];
      if (pages.length === 0) return;
      current = Math.max(0, Math.min(i, pages.length - 1));
      pages.forEach((c, idx) => c.classList.toggle('hidden', idx !== current));
      const last = current === pages.length - 1;
      document.getElementById('progress').textContent = `Question ${current + 1} of ${pages.length}`;
      document.getElementById('prev-btn').disabled = current === 0;
      document.getElementById('next-btn').classList.toggle('hidden', last);
      document.getElementById('submit-btn').classList.toggle('hidden', !last);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let submitting = false;
    document.getElementById('test-form').addEventListener('submit', (e) => {
      e.preventDefault();
      submitTest(false);
    });

    async function submitTest(auto) {
      if (submitting) return;
      if (!auto && !confirm('Submit your test? You cannot change answers after this.')) return;
      submitting = true;
      if (timerInterval) clearInterval(timerInterval);
      const answers = {};
      QUESTIONS.forEach((q) => {
        const field = document.querySelector(`[name="q${q.id}"]:checked`) || document.querySelector(`textarea[name="q${q.id}"]`);
        answers[q.id] = field ? field.value : '';
      });
      try {
        const r = await api('/api/submit/' + assignmentId, 'POST', { answers });
        document.getElementById('test-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        let note = auto ? "⏱ Time's up — your test was submitted automatically. " : '';
        if (r.needsGrading) note += 'Some written answers still need to be graded by your teacher.';
        document.getElementById('result-score').textContent = r.needsGrading
          ? `Auto-graded score: ${r.autoScore} / ${r.maxScore}`
          : `Your score: ${r.autoScore} / ${r.maxScore}`;
        document.getElementById('result-note').textContent = note;
      } catch (err) {
        submitting = false;
        showMsg('msg', err.message);
      }
    }
  </script>
</body>
</html>
