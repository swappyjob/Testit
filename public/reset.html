<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">📝 Test<span>Platform</span></a>
  </div>

  <div class="container narrow">
    <div class="card">
      <h1>Choose a new password</h1>
      <div id="msg" class="msg hidden"></div>

      <div id="form-wrap" class="hidden">
        <p class="muted">Resetting the password for <b id="email"></b>.</p>
        <form id="reset-form">
          <label>New password (min 6 characters)</label>
          <input type="password" id="password" required autocomplete="new-password">
          <label>Confirm new password</label>
          <input type="password" id="confirm" required autocomplete="new-password">
          <div style="margin-top:18px"><button class="btn" type="submit">Set new password</button></div>
        </form>
      </div>

      <div id="done" class="hidden">
        <p class="msg ok">Your password has been updated. You can now log in.</p>
        <a class="btn" id="login-link" href="/">Go to login</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    let role = 'student';

    (async () => {
      if (!token) { showMsg('msg', 'No reset token in the link.'); return; }
      try {
        const info = await api('/api/reset/' + encodeURIComponent(token));
        role = info.role;
        document.getElementById('email').textContent = info.email;
        document.getElementById('form-wrap').classList.remove('hidden');
      } catch (err) {
        showMsg('msg', err.message);
      }
    })();

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) { showMsg('msg', 'The passwords do not match.'); return; }
      try {
        const r = await api('/api/reset/' + encodeURIComponent(token), 'POST', { password });
        const loginUrl = r.role === 'teacher' ? '/teacher-login.html' : '/student-login.html';
        document.getElementById('login-link').href = loginUrl;
        document.getElementById('form-wrap').classList.add('hidden');
        document.getElementById('done').classList.remove('hidden');
      } catch (err) { showMsg('msg', err.message); }
    });
  </script>
</body>
</html>
