<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">📝 Test<span>Platform</span></a>
  </div>

  <div class="container narrow">
    <div class="card">
      <h1>Forgot your password?</h1>
      <p class="muted">Enter your email and we'll send you a link to reset your password.</p>
      <div id="msg" class="msg hidden"></div>
      <form id="forgot-form">
        <label>Email</label>
        <input type="email" id="email" required>
        <div style="margin-top:18px"><button class="btn" type="submit">Send reset link</button></div>
      </form>
    </div>
    <p class="center muted">
      <a href="/teacher-login.html">Teacher login</a> · <a href="/student-login.html">Student login</a>
    </p>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/api/forgot-password', 'POST', { email: document.getElementById('email').value });
        showMsg('msg',
          "If an account exists for that email, a reset link has been sent. Please check your inbox. " +
          "If email isn't set up on this server, ask your teacher/admin for a reset link.", 'ok');
        document.getElementById('forgot-form').classList.add('hidden');
      } catch (err) { showMsg('msg', err.message); }
    });
  </script>
</body>
</html>
