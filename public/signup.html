<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create your student account</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">📝 Test<span>Platform</span></a>
  </div>

  <div class="container narrow">
    <div class="card">
      <h1>Welcome! 🎓</h1>
      <div id="msg" class="msg hidden"></div>

      <div id="form-wrap" class="hidden">
        <p class="muted">Your teacher invited you. Set a password to finish creating your account.</p>
        <label>Name</label>
        <input type="text" id="name" disabled>
        <label>Email</label>
        <input type="email" id="email" disabled>
        <form id="signup-form">
          <label>Choose a password (min 6 characters)</label>
          <input type="password" id="password" required>
          <div style="margin-top:18px"><button class="btn" type="submit">Create account & log in</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get('token');

    (async () => {
      if (!token) { showMsg('msg', 'No signup token in the link.'); return; }
      try {
        const info = await api('/api/signup/' + encodeURIComponent(token));
        document.getElementById('name').value = info.name;
        document.getElementById('email').value = info.email;
        document.getElementById('form-wrap').classList.remove('hidden');
      } catch (err) {
        showMsg('msg', err.message);
      }
    })();

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/api/signup/' + encodeURIComponent(token), 'POST', {
          password: document.getElementById('password').value,
        });
        location.href = '/student.html';
      } catch (err) { showMsg('msg', err.message); }
    });
  </script>
</body>
</html>
